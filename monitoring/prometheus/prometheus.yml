global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'windows_exporter'
    static_configs:
      - targets: [ 'host.docker.internal:9182' ]

  - job_name: 'promtail'
    static_configs:
      - targets: [ 'host.docker.internal:9080' ]

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']